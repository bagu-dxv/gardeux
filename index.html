<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist SOAP – Exercice</title>
<meta name="description" content="Exercice interactif : retrouvez les informations S et O nécessaires à l'analyse pharmaceutique (méthode SOAP).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="brand"><span class="mark">℞</span> Exercice SOAP</div>
    <button id="reset" class="ghost" type="button">Recommencer</button>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1 id="titre"></h1>
    <p class="sub" id="sousTitre"></p>
    <p class="consigne" id="consigne"></p>
  </section>

  <section class="search-card" aria-label="Recherche">
    <form id="form" autocomplete="off">
      <label for="q" class="sr-only">Saisissez un élément</label>
      <input id="q" type="text" placeholder="Ex. : allergies, poids, tabac…" autofocus>
      <button type="submit">Valider</button>
    </form>
    <p id="feedback" class="feedback" role="status" aria-live="polite">&nbsp;</p>

    <div class="progress">
      <div class="progress-head">
        <span><strong id="found">0</strong> / <span id="total">0</span> éléments trouvés</span>
        <span id="pct">0 %</span>
      </div>
      <div class="bar"><div id="fill"></div></div>
    </div>
  </section>

  <section id="bravo" class="bravo" hidden>
    <div class="bravo-icon">✓</div>
    <div>
      <h2>Félicitations !</h2>
      <p>Vous avez retrouvé toutes les informations nécessaires à l'analyse pharmaceutique.</p>
    </div>
  </section>

  <div id="board" class="board"></div>
</main>

<footer class="wrap foot">Saisissez un mot ou une expression : majuscules, accents et petites fautes sont tolérés.</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
